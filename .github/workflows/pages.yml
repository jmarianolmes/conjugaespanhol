name: GitHub Pages

# Manual only. O Pages deste repo publica a pasta principal (main).
# O site estático fica em docs/ (URL: .../conjugaespanhol/docs/).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build:pages
